name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # Repo metadata, not the plugin files. A custom-repository install does not run these.
          # License is read from the default branch, so it stays empty until LICENSE is on main.
          ignore: description topics license
